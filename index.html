<header><img src="logo.png" alt="Surya Husadha"><h1>Laporan Harian Kepala Ruangan<small>Dashboard ruang rawat</small></h1><button id="pill" aria-live="polite"></button><button class="hb" id="hf">+ Isi laporan</button><button class="hb g" id="hs">Sinkron</button><button class="hb" id="hr" title="Muat ulang aplikasi dan ambil versi terbaru">&#8635; Refresh</button></header>
<main>
<section id="v-dash" class="on">

</section>

<section id="v-rkp"><div class="bar"><label>Jenis rekap<select id="rj"><option value="mg">Mingguan</option><option value="bl">Bulanan</option><option value="tw">Triwulan (TW)</option></select></label><label>Ruang<select id="rr"></select></label><label>Tanggal acuan<input type="date" id="ra"></label></div>
 <div class="bar"><button class="b o" id="rpv">&#8249; Sebelumnya</button><button class="b o" id="rnx">Berikutnya &#8250;</button><button class="b o" id="rtd">Saat ini</button></div>
